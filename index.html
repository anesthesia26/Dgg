<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#F8FAFC">
  <title>تسجيل الدخول | الموسوعة التخديرية السريرية الشاملة</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">

  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* Specific Landing & Login Styling (Glassmorphism + Neumorphism Blend) */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px 16px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--glass-surface);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 36px 30px 30px;
      width: 100%;
      max-width: 430px;
      box-shadow: 
        var(--shadow-sm),
        var(--shadow-lg),
        var(--glass-sheen);
      text-align: center;
      position: relative;
    }

    /* Soft Neumorphic Emblem */
    .login-logo {
      width: 66px;
      height: 66px;
      margin: 0 auto 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      box-shadow: var(--neu-button);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-logo svg {
      width: 32px;
      height: 32px;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid var(--primary-border);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
      letter-spacing: 0.2px;
    }

    .login-field {
      margin-bottom: 16px;
      text-align: right;
    }

    .login-field label {
      display: block;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon-box {
      position: absolute;
      right: 14px;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-wrapper input {
      width: 100%;
      height: 46px;
      padding: 10px 44px 10px 14px;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid var(--glass-border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      outline: none;
      box-shadow: var(--neu-inset);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .input-wrapper input:focus {
      background: #FFFFFF;
      border-color: var(--primary);
      box-shadow: var(--neu-inset-focus), 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .input-wrapper input:focus + .input-icon-box,
    .input-wrapper:focus-within .input-icon-box {
      color: var(--primary);
    }

    .input-wrapper button.toggle-pwd {
      position: absolute;
      left: 10px;
      width: 30px;
      height: 30px;
      background: none;
      border: none;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      padding: 0;
    }

    .input-wrapper button.toggle-pwd:hover {
      color: var(--text-primary);
      background: rgba(15, 23, 42, 0.05);
    }

    .input-wrapper button.toggle-pwd svg {
      width: 18px;
      height: 18px;
    }

    /* Tactile Neumorphic Primary Submit Button */
    .login-btn {
      width: 100%;
      height: 48px;
      background: var(--primary);
      border: 1px solid rgba(37, 99, 235, 0.9);
      border-radius: var(--radius-md);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      box-shadow: var(--neu-button), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .login-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.28);
    }

    .login-btn:active {
      transform: scale(0.99);
      box-shadow: var(--neu-pressed);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-alert {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      margin-bottom: 16px;
      display: none;
      text-align: right;
      font-weight: 500;
      line-height: 1.5;
    }

    .login-alert.error {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--emergency-bg);
      border: 1px solid rgba(252, 165, 165, 0.7);
      color: var(--emergency);
    }

    .login-alert.success {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(240, 253, 244, 0.9);
      border: 1px solid rgba(134, 239, 172, 0.7);
      color: var(--secondary);
    }

    /* Minimal Contact Buttons */
    .contact-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--glass-border-subtle);
      text-align: center;
    }

    .contact-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-contact {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      border: 1px solid var(--glass-border-subtle);
      background: rgba(255, 255, 255, 0.75);
      box-shadow: var(--neu-button);
      transition: all 0.2s ease;
    }

    .btn-tg {
      color: #0369A1;
    }

    .btn-tg:hover {
      background: #24A1DE;
      color: #FFFFFF;
      border-color: #24A1DE;
      box-shadow: 0 4px 14px rgba(36, 161, 222, 0.28);
      transform: translateY(-1px);
    }

    .btn-ig {
      color: #BE123C;
    }

    .btn-ig:hover {
      background: #E1306C;
      color: #FFFFFF;
      border-color: #E1306C;
      box-shadow: 0 4px 14px rgba(225, 48, 108, 0.28);
      transform: translateY(-1px);
    }

    .btn-contact svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    
    <!-- Tactile Minimal Emblem -->
    <div class="login-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
    </div>

    <div class="login-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>Clinical Master Portal</span>
    </div>

    <h1 style="font-size: 21px; font-weight: 800; margin-bottom: 4px;">الموسوعة التخديرية السريرية</h1>
    <p style="color: var(--text-muted); font-size: 12.5px; font-weight: 500; margin-bottom: 22px;">
      Comprehensive Anesthesia &amp; ICU Workstation<br>بوابة المشتركين المعتمدين
    </p>

    <div id="login-alert" class="login-alert" role="alert"></div>

    <form id="login-form" onsubmit="handleUserLogin(event)">
      
      <div class="login-field">
        <label for="login-username">اسم المستخدم (Username)</label>
        <div class="input-wrapper">
          <span class="input-icon-box" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input type="text" id="login-username" required placeholder="أدخل اسم المستخدم المصرح به" autocomplete="username">
        </div>
      </div>

      <div class="login-field">
        <label for="login-password">كلمة المرور (Password)</label>
        <div class="input-wrapper">
          <span class="input-icon-box" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="login-password" required placeholder="أدخل كلمة المرور" autocomplete="current-password">
          <button type="button" class="toggle-pwd" onclick="togglePasswordVisibility('login-password')" aria-label="تبديل إظهار كلمة المرور">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="login-btn">
        <span>تسجيل الدخول</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
          <polyline points="10 17 15 12 10 7"/>
          <line x1="15" y1="12" x2="3" y2="12"/>
        </svg>
      </button>
    </form>

    <div class="contact-section">
      <div class="contact-title">للاشتراك وتفعيل الحساب تواصل معنا مباشرة:</div>
      <div class="contact-grid">
        <a href="https://t.me/ddd4dddd" target="_blank" rel="noopener noreferrer" class="btn-contact btn-tg">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.75-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
          <span>تليجرام</span>
        </a>

        <a href="https://instagram.com/3i9ik" target="_blank" rel="noopener noreferrer" class="btn-contact btn-ig">
          <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          <span>انستغرام</span>
        </a>
      </div>
      <div class="footer-badge">By: Komail Nabeel / B.M.T Of Anesthesia &amp; ICU</div>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyAibJ6AdbZgW_Xjz1ips8OMEsNUfY9au9w",
    authDomain: "anesthesia-a11fa.firebaseapp.com",
    projectId: "anesthesia-a11fa",
    storageBucket: "anesthesia-a11fa.firebasestorage.app",
    messagingSenderId: "194393218681",
    appId: "1:194393218681:web:aa3dbd2b562ec356727ea8",
    measurementId: "G-Y0FFFVNNFR"
  };

  const ADMIN_CREDENTIALS = {
    username: "komail",
    password: "kom04"
  };

  let firestoreDb = null;
  let isFirebaseReady = false;

  try {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      firestoreDb = firebase.firestore();
      isFirebaseReady = true;
    }
  } catch (err) {
    console.error("Firebase init error:", err);
  }

  function togglePasswordVisibility(id) {
    const input = document.getElementById(id);
    const eyeIcon = document.getElementById('eye-icon');
    if (input) {
      if (input.type === 'password') {
        input.type = 'text';
        if (eyeIcon) {
          eyeIcon.innerHTML = `
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          `;
        }
      } else {
        input.type = 'password';
        if (eyeIcon) {
          eyeIcon.innerHTML = `
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          `;
        }
      }
    }
  }

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('login-alert');
    if (!el) return;
    el.className = 'login-alert ' + type;
    const icon = type === 'success' ? '✓ ' : '⚠️ ';
    el.textContent = icon + msg;
    el.style.display = 'flex';
  }

  function hideAlert() {
    const el = document.getElementById('login-alert');
    if (el) el.style.display = 'none';
  }

  // Clean session if user explicitly logged out
  (function() {
    try {
      const params = new URLSearchParams(window.location.search);
      if (params.has('logged_out')) {
        localStorage.removeItem('anesthesia_session');
        sessionStorage.removeItem('anesthesia_session');
      }
    } catch(e) {}
  })();

  async function handleUserLogin(e) {
    if (e) e.preventDefault();
    hideAlert();

    const uInput = document.getElementById('login-username');
    const pInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('login-submit-btn');

    const username = (uInput ? uInput.value : '').trim().toLowerCase();
    const password = (pInput ? pInput.value : '').trim();

    if (!username || !password) {
      showAlert('يرجى كتابة اسم المستخدم وكلمة المرور.', 'error');
      return;
    }

    // 1. Admin Verification
    if (username === ADMIN_CREDENTIALS.username.toLowerCase() && password === ADMIN_CREDENTIALS.password) {
      const session = {
        username: 'komail',
        role: 'admin',
        name: 'المدير كميل',
        fullName: 'المدير كميل',
        loggedAt: new Date().toISOString()
      };
      localStorage.setItem('anesthesia_session', JSON.stringify(session));
      sessionStorage.setItem('anesthesia_session', JSON.stringify(session));
      showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك للمنظومة السريرية...', 'success');
      setTimeout(() => {
        window.location.replace('app.html');
      }, 400);
      return;
    }

    // 2. Subscriber Verification via Firebase Firestore
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>جاري التحقق من الاشتراك...</span>';
    }

    try {
      if (!isFirebaseReady || !firestoreDb) {
        throw new Error("قاعدة بيانات Firebase غير متصلة. تحقق من اتصالك بالإنترنت.");
      }

      const docSnap = await firestoreDb.collection('subscribers').doc(username).get();

      if (docSnap.exists) {
        const data = docSnap.data();
        if (data.password === password) {
          if (data.status === 'blocked' || data.status === 'inactive') {
            showAlert('عذراً، هذا الحساب معطل حالياً. يُرجى مراجعة إدارة النظام.', 'error');
            return;
          }

          // Check expiration
          if (data.expiresAt) {
            const expTime = new Date(data.expiresAt).getTime();
            if (Date.now() > expTime) {
              showAlert('عذراً، لقد انتهت صلاحية اشتراكك. تواصل معنا لتجديد الاشتراك.', 'error');
              return;
            }
          }

          const session = {
            username: data.username || username,
            role: 'subscriber',
            name: data.name || data.fullName || username,
            fullName: data.fullName || data.name || username,
            expiresAt: data.expiresAt || null,
            loggedAt: new Date().toISOString()
          };
          localStorage.setItem('anesthesia_session', JSON.stringify(session));
          sessionStorage.setItem('anesthesia_session', JSON.stringify(session));
          showAlert('تم تسجيل الدخول بنجاح! جاري تحويلك للمنظومة السريرية...', 'success');
          setTimeout(() => {
            window.location.replace('app.html');
          }, 400);
        } else {
          showAlert('كلمة المرور غير صحيحة.', 'error');
        }
      } else {
        showAlert('اسم المستخدم غير مسجل ضمن المشتركين المعتمدين. تواصل معنا للاشتراك.', 'error');
      }
    } catch (err) {
      console.error("Login check error:", err);
      let errText = 'خطأ أثناء التحقق: ';
      if (err.code === 'permission-denied') {
        errText += 'يرجى مراجعة صلاحيات Firestore في لوحة Firebase.';
      } else {
        errText += (err.message || 'تحقق من اتصال الإنترنت.');
      }
      showAlert(errText, 'error');
    } finally {
      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <span>تسجيل الدخول</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        `;
      }
    }
  }
</script>

</body>
</html>
